<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VLU Walking Skeleton - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      width: 340px;
      padding: 28px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }
    h1 { margin: 0 0 20px; font-size: 22px; text-align: center; color: #1f3864; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #c8ccd0;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 11px;
      border: 0;
      border-radius: 6px;
      background: #2f5496;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #1f3864; }
    #message { margin-top: 14px; min-height: 20px; text-align: center; font-size: 14px; }
    #message.success { color: #1a7f37; }
    #message.error { color: #c62828; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Đăng nhập</h1>
    <form id="login-form" novalidate>
      <label for="username">Tên đăng nhập</label>
      <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" />

      <label for="password">Mật khẩu</label>
      <input type="password" id="password" name="password" placeholder="••••••" autocomplete="current-password" />

      <button type="submit" id="login-btn">Đăng nhập</button>
    </form>
    <div id="message" role="alert"></div>
  </div>

  <script src="login.js"></script>
</body>
</html>
